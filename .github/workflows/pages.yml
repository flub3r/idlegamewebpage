name: Deploy HASHNOVA to GitHub Pages

on:
  push:
    branches:
      - main
      - fix/pages-deployment
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        shell: bash
        run: |
          cat deploy/hashnova-minimal.b64.part-* > /tmp/hashnova-source.b64
          base64 --decode /tmp/hashnova-source.b64 > /tmp/hashnova-source.tar.gz
          echo "8ee516eaa0e11939e0d79c9882f472e596e2cbfc90ddbc1475371a799a28adb7  /tmp/hashnova-source.tar.gz" | sha256sum --check --strict
          mkdir -p app
          tar -xzf /tmp/hashnova-source.tar.gz -C app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Build for GitHub Pages
        working-directory: app
        run: npm run build -- --base /idlegamewebpage/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
